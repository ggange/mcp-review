version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ggange"
    labels:
      - "dependencies"
      - "automated"
    # Group all minor/patch updates into one PR per dependency type.
    # Major bumps still open individual PRs so they can be reviewed separately.
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates for critical packages
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      # TS 7 is not yet supported by typescript-eslint or the Next.js compiler API
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename(); eslint-plugin-react (pulled in by
      # eslint-config-next) still calls it, so the lint job crashes. Unpin once
      # eslint-plugin-react ships an ESLint 10 compatible release.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "ggange"
    labels:
      - "github-actions"
      - "automated"
