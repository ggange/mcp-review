<svg xmlns="http://www.w3.org/2000/svg" width="200" height="20" viewBox="0 0 200 20">
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
  </linearGradient>
  <rect width="200" height="20" fill="url(#bg)" rx="3"/>
  <text x="10" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" font-weight="600">{{BRAND_NAME}}</text>
  <text x="110" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="white">{{RATING_DISPLAY}} ({{TOTAL_RATINGS}})</text>
</svg>
